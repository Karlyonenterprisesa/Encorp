<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" role="img" aria-label="Reconhecer um AVC: FAST"><title>Reconhecer um AVC: FAST</title><rect x="0" y="0" width="900" height="454" rx="18" fill="#fff" stroke="#d5deee" stroke-width="2"/><text x="30" y="46" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0b1a33" text-anchor="start">Reconhecer um AVC: FAST</text><rect x="24" y="70" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="110" r="30" fill="#c62828"/><text x="74" y="121" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">F</text><text x="124" y="106" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Face (Face)</text><text x="124" y="132" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Peça para sorrir: um lado cai?</text><rect x="24" y="166" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="206" r="30" fill="#f28c1c"/><text x="74" y="217" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="124" y="202" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Braços (Arms)</text><text x="124" y="228" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Levante os dois: um desce ou não sobe?</text><rect x="24" y="262" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="302" r="30" fill="#0148e0"/><text x="74" y="313" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">S</text><text x="124" y="298" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Fala (Speech)</text><text x="124" y="324" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Repita uma frase: arrastada ou confusa?</text><rect x="24" y="358" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="398" r="30" fill="#0b1a33"/><text x="74" y="409" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">T</text><text x="124" y="394" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Tempo (Time)</text><text x="124" y="420" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Ligue já para o número de emergência</text></svg>