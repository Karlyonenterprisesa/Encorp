<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Tipos de choque"><title>Tipos de choque</title><rect x="0" y="0" width="900" height="330" rx="18" fill="#fff" stroke="#d5deee" stroke-width="2"/><text x="30" y="46" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0b1a33" text-anchor="start">Tipos de choque</text><rect x="24" y="70" width="206" height="240" rx="14" fill="#c62828"/><text x="127" y="112" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Hipovolémico</text><text x="127" y="150" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">Perda de volume:</text><text x="127" y="176" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">hemorragia,</text><text x="127" y="202" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">desidratação</text><rect x="238" y="70" width="206" height="240" rx="14" fill="#0148e0"/><text x="341" y="112" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Cardiogénico</text><text x="341" y="150" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">A bomba falha:</text><text x="341" y="176" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">enfarte, arritmia,</text><text x="341" y="202" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">insuficiência cardíaca</text><rect x="452" y="70" width="206" height="240" rx="14" fill="#8a1fa0"/><text x="555" y="112" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Distributivo</text><text x="555" y="150" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">Vasodilatação:</text><text x="555" y="176" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">sepsis, anafilaxia,</text><text x="555" y="202" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">lesão medular</text><rect x="666" y="70" width="206" height="240" rx="14" fill="#14803c"/><text x="769" y="112" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Obstrutivo</text><text x="769" y="150" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">Obstáculo ao fluxo:</text><text x="769" y="176" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">embolia pulmonar,</text><text x="769" y="202" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#fff" text-anchor="middle">pneumotórax</text></svg>