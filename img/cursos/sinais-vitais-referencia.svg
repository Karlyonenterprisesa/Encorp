<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="Valores de referência no adulto em repouso"><title>Valores de referência no adulto em repouso</title><rect x="0" y="0" width="900" height="450" rx="18" fill="#fff" stroke="#d5deee" stroke-width="2"/><text x="30" y="46" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0b1a33" text-anchor="start">Valores de referência no adulto em repouso</text><text x="345.0" y="94" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#44546f" text-anchor="middle">BAIXO</text><text x="555.0" y="94" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#44546f" text-anchor="middle">NORMAL</text><text x="765.0" y="94" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#44546f" text-anchor="middle">ALTO</text><text x="30" y="146" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1a33" text-anchor="start">Temperatura axilar</text><rect x="244.0" y="112" width="202.0" height="52" rx="10" fill="#0148e0"/><text x="345.0" y="146" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">&lt; 35,0 °C</text><rect x="454.0" y="112" width="202.0" height="52" rx="10" fill="#14803c"/><text x="555.0" y="146" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">36,0–37,0 °C</text><rect x="664.0" y="112" width="202.0" height="52" rx="10" fill="#c62828"/><text x="765.0" y="146" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">≥ 38,0 °C</text><text x="30" y="210" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1a33" text-anchor="start">Pulso (bpm)</text><rect x="244.0" y="176" width="202.0" height="52" rx="10" fill="#0148e0"/><text x="345.0" y="210" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">&lt; 60</text><rect x="454.0" y="176" width="202.0" height="52" rx="10" fill="#14803c"/><text x="555.0" y="210" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">60–100</text><rect x="664.0" y="176" width="202.0" height="52" rx="10" fill="#c62828"/><text x="765.0" y="210" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">&gt; 100</text><text x="30" y="274" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1a33" text-anchor="start">Respiração (rpm)</text><rect x="244.0" y="240" width="202.0" height="52" rx="10" fill="#0148e0"/><text x="345.0" y="274" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">&lt; 12</text><rect x="454.0" y="240" width="202.0" height="52" rx="10" fill="#14803c"/><text x="555.0" y="274" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">12–20</text><rect x="664.0" y="240" width="202.0" height="52" rx="10" fill="#c62828"/><text x="765.0" y="274" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">&gt; 20</text><text x="30" y="338" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1a33" text-anchor="start">SpO₂ em ar ambiente</text><rect x="244.0" y="304" width="202.0" height="52" rx="10" fill="#c62828"/><text x="345.0" y="338" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">≤ 90 %</text><rect x="454.0" y="304" width="202.0" height="52" rx="10" fill="#f28c1c"/><text x="555.0" y="338" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="