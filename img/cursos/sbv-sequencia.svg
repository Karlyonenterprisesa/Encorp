<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" role="img" aria-label="Suporte básico de vida no adulto"><title>Suporte básico de vida no adulto</title><rect x="0" y="0" width="900" height="646" rx="18" fill="#fff" stroke="#d5deee" stroke-width="2"/><text x="30" y="46" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0b1a33" text-anchor="start">Suporte básico de vida no adulto</text><rect x="24" y="70" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="110" r="30" fill="#14803c"/><text x="74" y="121" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="124" y="106" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Segurança</text><text x="124" y="132" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Cena segura? Use luvas se tiver</text><rect x="24" y="166" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="206" r="30" fill="#0148e0"/><text x="74" y="217" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="124" y="202" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Responde?</text><text x="124" y="228" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Chame e toque nos ombros</text><rect x="24" y="262" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="302" r="30" fill="#0148e0"/><text x="74" y="313" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="124" y="298" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Respira normalmente?</text><text x="124" y="324" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Veja, ouça e sinta até 10 segundos</text><rect x="24" y="358" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="398" r="30" fill="#f28c1c"/><text x="74" y="409" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="124" y="394" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Peça ajuda e o DEA</text><text x="124" y="420" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Alta voz, siga o operador</text><rect x="24" y="454" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="494" r="30" fill="#c62828"/><text x="74" y="505" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="124" y="490" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">30 compressões + 2 ventilações</text><text x="124" y="516" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">5 a 6 cm, 100 a 120 por minuto</text><rect x="24" y="550" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="590" r="30" fill="#f28c1c"/><text x="74" y="601" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="124" y="586" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Ligue o DEA</text><text x="124" y="612" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Siga as instruções de voz</text></svg>