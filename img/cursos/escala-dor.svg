amily="Outfit,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">7</text><rect x="638" y="80" width="68" height="68" rx="12" fill="#dc4a1c"/><text x="672" y="125" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">8</text><rect x="714" y="80" width="68" height="68" rx="12" fill="#c62828"/><text x="748" y="125" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">9</text><rect x="790" y="80" width="68" height="68" rx="12" fill="#8e1b1b"/><text x="824" y="125" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">10</text><text x="30" y="190" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#44546f" text-anchor="start">Sem dor</text><text x="450" y="190" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#44546f" text-anchor="middle">Dor moderada</text><text x="870" y="190" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#44546f" text-anchor="end">Pior dor imaginável</text><text x="30" y="234" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#0b1a33" text-anchor="start">Peça ao doente que indique o número. Registe o valor, o local e a hora.</text></svg>