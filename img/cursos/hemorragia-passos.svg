<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-label="Hemorragia externa grave"><title>Hemorragia externa grave</title><rect x="0" y="0" width="900" height="550" rx="18" fill="#fff" stroke="#d5deee" stroke-width="2"/><text x="30" y="46" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0b1a33" text-anchor="start">Hemorragia externa grave</text><rect x="24" y="70" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="110" r="30" fill="#c62828"/><text x="74" y="121" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="124" y="106" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Pressão directa</text><text x="124" y="132" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Pano limpo sobre a ferida, mãos firmes</text><rect x="24" y="166" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="206" r="30" fill="#c62828"/><text x="74" y="217" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="124" y="202" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Não retire o pano</text><text x="124" y="228" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Se encharcar, ponha outro por cima</text><rect x="24" y="262" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="302" r="30" fill="#f28c1c"/><text x="74" y="313" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="124" y="298" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Eleve o membro</text><text x="124" y="324" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Se não houver suspeita de fractura</text><rect x="24" y="358" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="398" r="30" fill="#0148e0"/><text x="74" y="409" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="124" y="394" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Penso compressivo</text><text x="124" y="420" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Ligadura firme, sem cortar a circulação</text><rect x="24" y="454" width="852" height="80" rx="14" fill="#eaf1ff"/><circle cx="74" cy="494" r="30" fill="#0b1a33"/><text x="74" y="505" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="124" y="490" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0b1a33" text-anchor="start">Peça ajuda</text><text x="124" y="516" font-family="Outfit,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#44546f" text-anchor="start">Garrote só em último recurso</text></svg>