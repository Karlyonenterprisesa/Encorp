name: Testes

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Depois de correr `npm install` uma vez e fazer commit do package-lock.json, troque por `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm test
